<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MinePred | FPS Intelligence · MinePred</title>
<link rel="stylesheet" href="/assets/css/app.css"></head>
<body><div class="app"><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">MW</div><div><strong>MinePred</strong><small>FPS INTELLIGENCE</small></div></div><div><div class="nav-label">OPERAÇÃO</div><nav class="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span>Visão geral</button><button data-page="inspection"><span class="ico">⌕</span>Nova inspeção</button><button data-page="history"><span class="ico">◷</span>Histórico de inspeções</button></nav></div><div><div class="nav-label">PLANEJAMENTO</div><nav class="nav"><button data-page="stock"><span class="ico">▤</span>Estoque e previsão</button><button data-page="settings"><span class="ico">⚙</span>Parâmetros técnicos</button></nav></div><div class="side-note"><b>ⓘ Dados de demonstração</b>Os números iniciais são fictícios. Configure os limites de desgaste com o manual específico da máquina e do FPS antes de usar em campo.</div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow">GESTÃO DE DESGASTE · MINERAÇÃO</div><h1 id="pageTitle">Visão geral da frota</h1></div><div class="top-actions"><button class="button light mobile-menu" onclick="toggleMobileNav()">☰ Menu</button><div class="date-chip" id="today">22 out 2026</div><div class="user-chip"><span class="avatar">VT</span><span>Equipe técnica</span></div></div></header><div id="pagesContainer" aria-live="polite"></div></main></div></div><div class="toast" id="toast"></div>
<script>
(async function loadMinePredPages(){
 const container=document.getElementById('pagesContainer');
 const pages=['dashboard','inspection','history','stock','settings'];
 try {
  const fragments=await Promise.all(pages.map(async name=>{
   const response=await fetch('/pages/'+name+'/view.html');
   if(!response.ok) throw new Error('Falha ao carregar a aba '+name);
   return response.text();
  }));
  container.innerHTML=fragments.join('');
  const script=document.createElement('script');
  script.src='/assets/js/app.js';
  document.body.appendChild(script);
 } catch(error) {
  container.innerHTML='<div class="panel"><h3>Não foi possível carregar o MinePred</h3><p>Atualize a página. Se o problema continuar, verifique os arquivos das abas no repositório.</p></div>';
  console.error(error);
 }
})();
</script></body></html>
